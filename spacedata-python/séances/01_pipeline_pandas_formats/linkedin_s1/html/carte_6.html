<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --page-plane: #0d0d0d;
    --surface: #1a1a19;
    --ink-primary: #ffffff;
    --ink-secondary: #c3c2b7;
    --ink-muted: #898781;
    --border-ring: rgba(255, 255, 255, 0.10);
    --blue: #3987e5;
    --accent: var(--blue);
    --accent-soft: rgba(57, 135, 229, 0.16);
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1080px; height: 1080px;
    background: var(--page-plane);
    font-family: var(--font-sans);
    color: var(--ink-primary);
  }
  .card {
    position: relative;
    width: 1080px; height: 1080px;
    background: var(--surface);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 90px 96px;
  }
  .card::before {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none; opacity: 0.55;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,0.55) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 80% 15%, rgba(255,255,255,0.40) 0, transparent 50%),
      radial-gradient(2px 2px at 50% 85%, rgba(255,255,255,0.30) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 30% 92%, rgba(255,255,255,0.35) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 65% 8%, rgba(255,255,255,0.40) 0, transparent 50%),
      radial-gradient(2px 2px at 92% 38%, rgba(255,255,255,0.30) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 15% 55%, rgba(255,255,255,0.30) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 88% 70%, rgba(255,255,255,0.35) 0, transparent 50%);
    background-repeat: repeat;
    background-size: 420px 420px;
  }
  .card::after {
    content: "";
    position: absolute;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-soft), transparent 70%);
    top: -260px; right: -180px;
    pointer-events: none;
    filter: blur(10px);
  }
  .card > * { position: relative; z-index: 1; }

  .kicker {
    text-transform: uppercase; letter-spacing: 0.12em; font-size: 22px;
    color: var(--accent); font-weight: 700; margin-bottom: 28px;
    display: flex; align-items: center; gap: 14px;
  }
  .kicker::before { content: ""; width: 36px; height: 3px; background: var(--accent); display: inline-block; }

  .title {
    font-size: 64px; font-weight: 700; line-height: 1.15;
    margin: 0 0 32px 0; max-width: 820px;
  }
  .body-text {
    font-size: 30px; color: var(--ink-secondary); line-height: 1.55;
    max-width: 780px; font-weight: 400;
  }

  .footer {
    position: absolute; left: 96px; right: 96px; bottom: 64px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-mono); font-size: 20px; color: var(--ink-muted);
  }
  .dots { display: flex; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border-ring); }
  .dot.active { background: var(--accent); }

  /* cover variant */
  .card--cover .title { font-size: 76px; max-width: 880px; }
  .card--cover .module-name { color: var(--ink-muted); font-size: 24px; margin-bottom: 36px; letter-spacing: 0.02em; }
  .meta-row { display: flex; gap: 16px; margin-top: 48px; flex-wrap: wrap; }
  .meta-chip {
    border: 1px solid var(--border-ring); border-radius: 999px;
    padding: 12px 28px; font-size: 22px; color: var(--ink-secondary);
  }
</style>
</head>
<body>
  <div class="card ">
    
        <div class="kicker">SÉANCE 2/6 · LA SUITE</div>
        <h2 class="title">Place aux APIs</h2>
        <p class="body-text">On quitte les fichiers locaux : construction d'une micro-API, puis interrogation d'une vraie API publique.</p>
        
    <div class="footer">
      <span>Python avancé — SpaceData</span>
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot active"></div></div>
      <span>6/6</span>
    </div>
  </div>
</body>
</html>
